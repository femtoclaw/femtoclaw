[package]
name = "femtoclaw"
version = "1.0.3"
edition = "2021"
license = "Apache-2.0"
description = "FemtoClaw — Industrial Agent Runtime: a lightweight, production-grade Rust AI agent runtime."
repository = "https://github.com/femtoclaw/femtoclaw.git"
keywords = ["agent", "ai", "rust", "runtime", "tools"]
categories = ["command-line-utilities"]

[features]
# Industrial Runtime defaults: small binary, minimal logging.
default = ["industrial"]
industrial = []
# Optional fuller logging / debug (kept minimal anyway).
full = ["tracing", "tracing-subscriber"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
femtoclaw-protocol = { path = "../femtoclaw-protocol", version = "1.0.3" }
femtoclaw-policy = { path = "../femtoclaw-policy", version = "1.0.3" }
femtoclaw-audit = { path = "../femtoclaw-audit", version = "1.0.3" }
femtoclaw-storage = { path = "../femtoclaw-storage", version = "1.0.3" }
femtoclaw-claws = { path = "../femtoclaw-claws", version = "1.0.3" }

tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["fmt", "ansi"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
